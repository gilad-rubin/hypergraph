repos:
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.0
    hooks:
      - id: nbstripout
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # Full-repo lint check before push — catches post-rebase formatting drift
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff
        name: ruff check (all files, pre-push)
        stages: [pre-push]
        args: [--no-fix]
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format (all files, pre-push)
        stages: [pre-push]
        args: [--check]
        pass_filenames: false
        always_run: true
  # template_sync.py is generated from template_async.py (ADR 0009). Catch a
  # hand-edit to either half at commit time, not one CI round-trip later.
  - repo: local
    hooks:
      - id: gen-sync-check
        name: template_sync.py matches template_async.py
        entry: uv run python scripts/gen_sync.py --check
        language: system
        pass_filenames: false
        files: ^(src/hypergraph/runners/_shared/template_(a)?sync\.py|scripts/gen_sync\.py)$

name: CI

on:
  push:
    branches: [master]
  # Every pull request, whatever branch it targets: stacked PRs (a leaf whose base is
  # the PR under it) must get the same lint/typecheck/test signal as one against master.
  pull_request:

jobs:
  # Each job runs one stage of scripts/ci.sh, the same command the local check runs
  # (AGENTS.md), so the two cannot drift apart. The stages hold the comments.
  lint:
    runs-on: ubuntu-24.04  # ubuntu-latest moved to 26.04, where Playwright installs no browsers (2026-10-29)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: scripts/ci.sh lint

  typecheck:
    runs-on: ubuntu-24.04  # ubuntu-latest moved to 26.04, where Playwright installs no browsers (2026-10-29)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: scripts/ci.sh typecheck

  otel-floor:
    runs-on: ubuntu-24.04  # ubuntu-latest moved to 26.04, where Playwright installs no browsers (2026-10-29)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: scripts/ci.sh otel-floor

  test:
    runs-on: ubuntu-24.04  # ubuntu-latest moved to 26.04, where Playwright installs no browsers (2026-10-29)
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: scripts/ci.sh test ${{ matrix.python-version }}

  # The test matrix renders the browser viz tests in Chromium; this job renders them in
  # WebKit (Safari, iOS web views), where some bugs show alone.
  viz-webkit:
    runs-on: ubuntu-24.04  # ubuntu-latest moved to 26.04, where Playwright installs no browsers (2026-10-29)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - run: scripts/ci.sh viz-webkit
